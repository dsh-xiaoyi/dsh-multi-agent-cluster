# dsh-agent-bridge - loader patch (prototype v0.1.0)
#
# FORMAT MATTERS (this cost one wasted restart):
#   a bundle patch must be a loader patch entry list. A bare plugin row is SILENTLY IGNORED:
#   the composition never contains the plugin, nothing logs, nothing errors.
#   Reference: dsh-memory-bridge/cordis.patch.yml uses exactly the shape below.
#
# The token is NOT here: it is read at runtime from an admin-only file produced from the
# vault.   vault name: bridge-token-hub-to-node     file: C:\dsh-mem\agent-bridge.token
#
# logPath is the proof of life: "installed" is not "loaded".
- insert:
    - id: agent-bridge
      name: dsh-agent-bridge
      config:
        path: /agent/inbox
        # SENDER whitelist (default-deny). Every node that may send to this relay must be
        # listed here — the cluster is MUTUAL, not hub-only.
        allowedFrom:
          # canonical machine names first (case-sensitive)
          - '<COMPUTERNAME-A>'
          - '<COMPUTERNAME-B>'
          - '<COMPUTERNAME-C>'
          # historical aliases (compat only; do not add new ones)
          - '<computer-name-b>'
          - '<agent-host>'
        token: ''
        tokenFile: 'C:\dsh-mem\agent-bridge.token'
        # per-peer tokens come from the ACL-tight file (never from config)
        peerTokensFile: 'C:\dsh-mem\bridge-peers.json'
        logPath: 'C:\dsh-mem\dsh-agent-bridge\bridge.log'
        # Local injection targets: alias -> a (parent,child) session pair.
        # An alias not registered here answers 404 by design.
        localTargets:
          '<HUB>/selftest':
            parentSessionId: 'session-<PARENT-ID>'
            childSessionId: 'child-<CHILD-ID>'
          '192.0.2.11/agent-1':
            parentSessionId: 'session-<PARENT-ID>'
            childSessionId: 'child-<CHILD-ID>'
          '<HUB>/ops':
            parentSessionId: 'session-<PARENT-ID>'
            childSessionId: 'child-<CHILD-ID>'
        peers: {}